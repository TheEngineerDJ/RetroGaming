name: Integrate Constitution

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate
        shell: bash
        run: |
          test -f CONSTITUTION_NEXT.md || exit 0
          python3 - <<'PY'
          from pathlib import Path
          c=Path('Constitution.md').read_text()
          n=Path('CONSTITUTION_NEXT.md').read_text()
          marker='# 192. Canonical Software Identity Model'
          if marker in n: n=n[n.index(marker):]
          c=c.replace('Document Version: 2.3.0','Document Version: 3.0.0',1)
          if '# 285. Integrated Review' not in c:
              c=c.rstrip()+'\n\n---\n\n'+n.strip()+'''\n\n---\n\n# 285. Integrated Review — Single Source of Truth\n\n`CONSTITUTION.md` is the only working constitution. `CONSTITUTION_NEXT.md` was an integration artifact, not a second constitution. Git history preserves prior versions.\n\n# 286. Integrated Review — Coherence\n\nThe constitution has been reviewed as one system. Its recurring backbone is:\n\nIdentity → Evidence → Provenance → Relationships → Context → Action.\n\nRepeated concepts remain where they apply at different abstraction levels. Contradictions must be resolved by rewriting principles, not by relying on chronology.\n\n# 287. Integrated Review — Build Readiness\n\nThe constitution provides sufficient direction for serious implementation of the first product wedge. Remaining work belongs primarily in implementation specifications, schema design, tests, UX flows, and engineering decisions derived from this document.\n\nThe ROM normalization workflow remains the first proving ground because it exercises identity, evidence, external datasets, matching, privacy, local storage, batch mutation, interoperability, and trust.\n\n# 288. Integrated Review — Final Architectural Standard\n\nRetroVault must always be able to answer four questions:\n\n**What do we think this is?**\n\n**Why do we think that?**\n\n**How certain are we?**\n\n**What would change our mind?**\n\nA trustworthy system records not only conclusions, but the conditions under which conclusions should be revised.\n'''
          Path('Constitution.md').write_text(c)
          Path('CONSTITUTION_NEXT.md').unlink()
          Path('.github/workflows/integrate-constitution.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Constitution.md CONSTITUTION_NEXT.md .github/workflows/integrate-constitution.yml
          git diff --cached --quiet || (git commit -m 'Merge constitution versions into single source of truth' && git push)
